# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: |
  Be direct, concise, and assertive.
  Focus on code correctness, security, and rule compliance without fluff.
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
