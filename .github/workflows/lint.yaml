name: Lint & Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install tools and binaries
        run: |
          uv tool install yamllint
          uv tool install ruff
          mkdir -p "$HOME/.local/bin"
          # Install yamlfmt via gh CLI
          # Determine architecture
          ARCH=$(uname -m)
          # Ensure supported architecture (x86_64 or aarch64)
          if [ "$ARCH" != "x86_64" ] && [ "$ARCH" != "aarch64" ]; then
            echo "Unsupported architecture: $ARCH" && exit 1
          fi
          # Get latest yamlfmt version tag
          YAMLFMT_VER=$(gh release list -R google/yamlfmt --limit 1 | awk '{print $1}')
          # Download the appropriate tarball
          gh release download "$YAMLFMT_VER" -R google/yamlfmt -p "yamlfmt_*_Linux_${ARCH}.tar.gz"
          tar -xzf "yamlfmt_*_Linux_${ARCH}.tar.gz" yamlfmt
          mv yamlfmt "$HOME/.local/bin/"
          # Clean up downloaded archive
          rm "yamlfmt_*_Linux_${ARCH}.tar.gz"
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          # Install actionlint via installer script
          ACTIONLINT_VER=$(curl -sSf "https://api.github.com/repos/rhysd/actionlint/releases/latest" \
              | jq -r '.tag_name // empty')
          if [ -z "$ACTIONLINT_VER" ] || [ "$ACTIONLINT_VER" = "null" ]; then
              ACTIONLINT_VER="v1.7.12"
          fi
          ACTIONLINT_URL="https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_VER}/install.sh"
          curl -sSfL "$ACTIONLINT_URL" \
            | sh -s -- -b "$HOME/.local/bin"
      - name: Verify tool installation
        run: |
          yamlfmt -version
          ruff --version
          actionlint -version
      - name: Run make lint
        run: make lint
      - name: Run make test
        run: make test
