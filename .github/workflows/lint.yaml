name: Lint & Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install tools and yamlfmt binary
        run: |
          pip install --no-cache-dir yamllint ruff
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          YAMLFMT_VER=$(curl -s "https://api.github.com/repos/google/yamlfmt/releases/latest" | \
            grep -Po '"tag_name": "v\K[^"]*')
          URL="https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VER}/yamlfmt_${YAMLFMT_VER}_Linux_x86_64.tar.gz"
          curl -sSL "$$URL" | tar -xz -C "$$HOME/.local/bin" yamlfmt
          chmod +x "$$HOME/.local/bin/yamlfmt"
      - name: Run make lint
        run: make lint
      - name: Run make test
        run: make test
