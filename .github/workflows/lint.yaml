name: Lint & Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@f94e4d16183a31c5180f9b69994c653fa652395d # v5.3.0
        with:
          enable-cache: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install tools and binaries
        run: |
          uv tool install yamllint ruff==0.8.4
          mkdir -p "$HOME/.local/bin"
          # Install yamlfmt via go
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Install actionlint via installer script
          ACTIONLINT_VER=$(curl -s "https://api.github.com/repos/rhysd/actionlint/releases/latest" |
            grep -Po '"tag_name": "\K[^"]*')
          # Fallback to v1.7.12 if detection fails
          ACTIONLINT_VER=${ACTIONLINT_VER:-v1.7.12}
          ACTIONLINT_URL="https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VER}/install.sh"
          curl -sSfL "$ACTIONLINT_URL" \
            | sh -s -- -b "$HOME/.local/bin"
      - name: Verify tool installation
        run: |
          yamlfmt -version
          ruff --version
          actionlint -version
      - name: Run make lint
        run: make lint
      - name: Run make test
        run: make test
