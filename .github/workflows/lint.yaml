name: Lint & Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22'
          cache: true
      - name: Install tools and binaries
        run: |
          uv tool install yamllint
          uv tool install ruff
          mkdir -p "$HOME/.local/bin"
          # Install yamlfmt via go
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          # Install actionlint via installer script
          ACTIONLINT_VER=$(curl -sSf "https://api.github.com/repos/rhysd/actionlint/releases/latest" \
              | jq -r '.tag_name // empty')
          if [ -z "$ACTIONLINT_VER" ] || [ "$ACTIONLINT_VER" = "null" ]; then
              ACTIONLINT_VER="v1.7.12"
          fi
          ACTIONLINT_URL="https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_VER}/install.sh"
          curl -sSfL "$ACTIONLINT_URL" \
            | sh -s -- -b "$HOME/.local/bin"
      - name: Verify tool installation
        run: |
          yamlfmt -version
          ruff --version
          actionlint -version
      - name: Run make lint
        run: make lint
      - name: Run make test
        run: make test
