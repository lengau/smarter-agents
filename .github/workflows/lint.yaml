name: Lint & Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install tools and binaries
        run: |
          uv tool install yamllint
          uv tool install ruff
          mkdir -p "$HOME/.local/bin"
          # Determine architectures
          UNAME_ARCH=$(uname -m)
          case "$UNAME_ARCH" in
            x86_64)
              YAMLFMT_ARCH="x86_64"
              ACTIONLINT_ARCH="amd64"
              ;;
            aarch64)
              YAMLFMT_ARCH="arm64"
              ACTIONLINT_ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $UNAME_ARCH" && exit 1
              ;;
          esac
          # Install yamlfmt via gh CLI
          YAMLFMT_VER=$(gh release list -R google/yamlfmt --limit 1 | awk '{print $1}')
          gh release download "$YAMLFMT_VER" -R google/yamlfmt -p "yamlfmt_*_Linux_${YAMLFMT_ARCH}.tar.gz"
          tar -xzf "yamlfmt_*_Linux_${YAMLFMT_ARCH}.tar.gz" yamlfmt
          mv yamlfmt "$HOME/.local/bin/"
          rm "yamlfmt_*_Linux_${YAMLFMT_ARCH}.tar.gz"
          # Install actionlint via gh CLI
          ACTIONLINT_VER=$(gh release list -R rhysd/actionlint --limit 1 | awk '{print $1}')
          gh release download "$ACTIONLINT_VER" -R rhysd/actionlint -p "actionlint_*_linux_${ACTIONLINT_ARCH}.tar.gz"
          tar -xzf "actionlint_*_linux_${ACTIONLINT_ARCH}.tar.gz" actionlint
          mv actionlint "$HOME/.local/bin/"
          rm "actionlint_*_linux_${ACTIONLINT_ARCH}.tar.gz"
      - name: Verify tool installation
        run: |
          yamlfmt -version
          ruff --version
          actionlint -version
      - name: Run make lint
        run: make lint
      - name: Run make test
        run: make test
